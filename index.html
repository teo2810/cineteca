<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a12">
<meta name="color-scheme" content="light dark">
<title>Cineteca</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@380;500;600&display=swap" rel="stylesheet">
<style>
:root, html[data-theme="dark"], html[data-theme="light"] {
  --bg: #0e0e10;
  --surface: #1a1a1e;
  --ink: #f5f5f6;
  --muted: #a1a1aa;
  --accent: #c6f54a;
  --accent-ink: #142006;
  --line: rgba(255, 255, 255, 0.1);
  --serif: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --sans: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --radius: 16px;
  --shadow: none;
  color-scheme: dark;
}
html[data-theme="light"] { --bg: #0e0e10; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(70% 80% at 0% 0%, rgba(198, 245, 74, 0.62), transparent 58%),
    radial-gradient(65% 75% at 100% 100%, rgba(157, 78, 255, 0.62), transparent 60%),
    linear-gradient(128deg, #1d2a0c 0%, #141816 46%, #241433 100%);
  background-attachment: fixed;
  color: #f7f4fb;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
img { max-width: 100%; }
.shell { min-height: 100vh; }
.nav {
  position: fixed;
  left: 50%;
  right: auto;
  bottom: calc(14px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(420px, calc(100% - 28px));
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 8px;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.1);
  color: #f7f4fb;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
}
.navbrand, .navfoot { display: none; }
.nav button {
  position: relative;
  appearance: none; -webkit-appearance: none;
  min-width: 0; min-height: 46px; border: 0; border-radius: 18px; background: transparent;
  color: rgba(247, 244, 251, 0.62);
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.nav button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.nav button[aria-current="page"] { background: rgba(255, 255, 255, 0.16); color: #fff; }
.nav button[aria-current="page"] svg { color: #fff; }
.nav button[aria-current="page"]::after { display: none; }
.nav svg { width: 22px; height: 22px; display: block; }
.maincol { padding: 0 16px calc(108px + env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; }
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 0 10px;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(16px);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 34px; height: 34px; border-radius: 10px; }
.brand h1 { font-family: var(--serif); font-size: 26px; line-height: 1; margin: 0; font-weight: 560; letter-spacing: -0.03em; }
.eyebrow { margin: 0 0 4px; color: var(--accent); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
.sync {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; min-height: 40px; padding: 0 14px 0 12px; font-size: 12px; font-weight: 600; color: var(--ink);
  max-width: 46vw; box-shadow: 0 8px 20px color-mix(in srgb, var(--ink) 8%, transparent);
}
.sync::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto;
}
.sync.on::before { background: #2f8f5b; }
.sync.bad::before { background: #b4532a; }
.sync span, .sync { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h2 { font-family: var(--serif); font-weight: 560; font-size: 34px; line-height: 1.05; letter-spacing: -0.03em; margin: 6px 0 8px; }
h3 { font-family: var(--serif); font-size: 22px; margin: 18px 0 10px; font-weight: 560; letter-spacing: -0.02em; }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 38rem; }
.wall { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 12px; -webkit-overflow-scrolling: touch; }
.wall .tile { flex: 0 0 168px; }
.tile {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  padding: 0; border: 0; background: transparent; min-width: 0;
}
.tile-poster, .hero-poster, .poster {
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--accent) 35%, var(--surface)), color-mix(in srgb, var(--ink) 8%, var(--surface)));
  color: var(--accent); font-family: var(--serif); overflow: hidden;
  display: grid; place-items: center;
}
.tile-poster { width: 100%; aspect-ratio: 2 / 3; border-radius: 22px; font-size: 40px; position: relative; box-shadow: 0 16px 30px rgba(0,0,0,.35); }
.tile-poster img, .hero-poster img, .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile-title { font-size: 13px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.scorebadge, .flag {
  position: absolute; font-style: normal; border-radius: 999px;
  background: color-mix(in srgb, var(--bg) 78%, transparent); color: var(--ink);
  backdrop-filter: blur(8px); padding: 2px 7px;
}
.scorebadge { top: 8px; right: 8px; font-family: var(--serif); font-size: 13px; }
.flag { left: 8px; bottom: 8px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
.meter { display: block; height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); }
.rail { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 14px; -webkit-overflow-scrolling: touch; }
.rail .tile { flex: 0 0 156px; }
.rowlist { display: flex; flex-direction: column; gap: 8px; }
.row {
  width: 100%; text-align: left; display: grid; grid-template-columns: 52px 1fr; gap: 12px;
  padding: 8px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); min-height: 84px;
}
.poster { width: 52px; height: 78px; border-radius: 10px; font-size: 22px; }
.row b { display: block; font-size: 16px; line-height: 1.3; }
.meta { color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg {
  display: flex; gap: 0; padding: 0; overflow-x: auto;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
}
.seg .chip {
  flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--muted);
  box-shadow: inset 0 -2px 0 transparent; font-weight: 600; white-space: nowrap;
}
.seg .chip[aria-pressed="true"] {
  background: transparent; color: var(--ink); border-color: transparent;
  box-shadow: inset 0 -2px 0 var(--accent);
}
.chip, .select, .field, .btn { min-height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip { padding: 0 14px; font-weight: 600; }
.chip[aria-pressed="true"], .chip.on { background: #f4f1fa; color: #1a1024; border-color: transparent; }
.select {
  appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 52%, calc(100% - 12px) 52%;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
}
.toolbar { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 4px; }
.field, .select, textarea {
  width: 100%; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
}
.searchline .field { min-height: 52px; border-radius: 999px; padding-left: 18px; font-size: 16px; }
textarea { min-height: 150px; border-radius: 18px; resize: vertical; line-height: 1.5; background: color-mix(in srgb, var(--surface) 88%, var(--bg)); }
.btn { padding: 0 18px; background: #f4f1fa; color: #1a1024; border-color: transparent; font-weight: 600; }
.btn.ghost { background: rgba(255, 255, 255, 0.08); color: #f7f4fb; border-color: rgba(255, 255, 255, 0.16); font-weight: 500; }
.btn.full { width: 100%; border-radius: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 18px 16px 16px;
  margin: 0 0 14px;
  box-shadow: 0 12px 32px color-mix(in srgb, var(--ink) 6%, transparent);
}
.card h3 { margin-top: 0; }
.pagehead {
  margin: 2px 0 18px; padding: 22px 18px 18px; border-radius: 28px; color: #f6f1e8;
  background:
    radial-gradient(420px 180px at 100% -30%, rgba(228, 161, 90, 0.5), transparent 60%),
    #16130f;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
}
.pagehead .eyebrow { color: #e4a15a; }
.pagehead h2 { color: #f6f1e8; font-size: 40px; margin: 0 0 6px; }
.pagehead .lead { color: #e4d5c6; margin: 0 0 14px; }
.pagehead .field { background: #fffdf8; color: #1b1712; border: 0; }
html[data-theme="dark"] .pagehead .field { background: #2a241c; color: #f6f1e8; }
.searchbar { display: flex; gap: 8px; align-items: center; }
.searchbar .field { min-height: 52px; border-radius: 999px; padding-left: 18px; }
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(102px + env(safe-area-inset-bottom));
  z-index: 30; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px;
}
.lobby { padding: 12px 0 8px; }
.lobby h2 { font-size: 42px; max-width: 12ch; }
.frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; }
.frame {
  aspect-ratio: 2 / 3; border-radius: 16px; padding: 10px;
  display: flex; align-items: flex-end;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  background:
    linear-gradient(to bottom, transparent 55%, color-mix(in srgb, var(--accent) 22%, var(--surface))),
    repeating-linear-gradient(90deg, transparent 0 10px, color-mix(in srgb, var(--accent) 28%, transparent) 10px 12px);
  font-family: var(--serif); font-size: 14px;
}
.billboard { position: relative; margin: 0 -16px 18px; padding: 8px 16px 8px; overflow: hidden; }
.billboard-bg {
  position: absolute; inset: -30px; background-size: cover; background-position: center 20%;
  filter: blur(28px) saturate(1.15); opacity: 0.55; transform: scale(1.08);
}
.billboard-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 20%, transparent), var(--bg) 92%); }
.billboard-body { position: relative; display: grid; grid-template-columns: 116px 1fr; gap: 14px; align-items: end; }
.hero-poster { width: 116px; aspect-ratio: 2 / 3; border-radius: 16px; font-size: 48px; box-shadow: var(--shadow); }
.billboard h2 { margin: 0 0 6px; font-size: 32px; }
.score { display: flex; align-items: baseline; gap: 12px; }
.score b { font-family: var(--serif); font-size: 48px; font-weight: 560; line-height: 0.9; letter-spacing: -0.04em; }
.stars { display: flex; flex-wrap: wrap; gap: 2px; margin: 8px 0; }
.star { position: relative; width: 28px; height: 36px; padding: 4px 0; border: 0; background: transparent; }
.star svg { width: 26px; height: 26px; display: block; fill: currentColor; }
.star-bg { color: color-mix(in srgb, var(--ink) 18%, transparent); }
.star-fg { position: absolute; left: 0; top: 4px; height: 26px; overflow: hidden; color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 36px; }
.cast, .relrail { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.person { width: 108px; flex: 0 0 auto; }
.person .ava {
  width: 76px; height: 76px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  background: color-mix(in srgb, var(--ink) 8%, var(--surface)); color: var(--muted); font-family: var(--serif); font-size: 22px;
}
.person .ava img { width: 100%; height: 100%; object-fit: cover; }
.person p { margin: 6px 0 0; font-size: 13px; font-weight: 600; }
.person span { color: var(--muted); font-size: 12px; }
.reltile { flex: 0 0 132px; text-align: left; border: 0; background: transparent; padding: 0; }
.reltile .tile-poster { border-radius: 12px; box-shadow: none; }
.reltile b { display: block; margin-top: 6px; font-size: 13px; line-height: 1.25; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.barline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 14px; }
.track { height: 7px; border-radius: 99px; background: var(--line); grid-column: 1 / -1; }
.track span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 16px; }
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.figure b { display: block; font-family: var(--serif); font-size: 28px; letter-spacing: -0.03em; line-height: 1; }
.figure span { color: var(--muted); font-size: 12px; }
.heatwrap { display: grid; grid-template-columns: 28px 1fr; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.heatwrap::-webkit-scrollbar { display: none; }
.heatlabels { display: grid; grid-template-rows: repeat(7, 14px); gap: 3px; color: var(--muted); font-size: 10px; }
.heat { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; }
.cell { width: 14px; height: 14px; border-radius: 4px; background: var(--line); }
.lv1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface)); }
.lv2 { background: color-mix(in srgb, var(--accent) 50%, var(--surface)); }
.lv3 { background: color-mix(in srgb, var(--accent) 72%, var(--surface)); }
.lv4 { background: var(--accent); }
.goals { display: grid; gap: 10px; }
.goal { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
.medal {
  width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  border: 1px solid var(--line); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  background: radial-gradient(circle at 50% 40%, var(--surface), color-mix(in srgb, var(--ink) 6%, var(--surface)));
}
.medal.t1, .medal.t2, .medal.t3 { color: var(--accent-ink); border-color: transparent; }
.medal.t1 { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); }
.medal.t2 { background: color-mix(in srgb, var(--accent) 78%, var(--ink)); }
.medal.t3 { background: var(--accent); }
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(102px + env(safe-area-inset-bottom));
  z-index: 30; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px;
}
.banner { border: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border-radius: 16px; padding: 12px 14px; margin: 0 0 12px; }
.reason { color: var(--accent); font-size: 12px; }
.split { display: flex; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.tiny { font-size: 13px; color: var(--muted); }
a { color: var(--accent); }
.epgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; margin-top: 8px; }
.eptile {
  text-align: left; border-radius: 14px; border: 1px solid var(--line); background: transparent;
  padding: 10px; min-height: 74px;
}
.eptile b { display: block; font-family: var(--serif); font-size: 20px; line-height: 1; }
.eptile.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
details.filters { border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px 8px; background: var(--surface); }
details.filters summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status-grid .chip { border-radius: 14px; }
@media (min-width: 720px) {
  .wall { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: visible; }
  .wall .tile { flex: none; }
  .goals { grid-template-columns: 1fr 1fr; }
  .lobby h2 { font-size: 64px; }
}
@media (min-width: 960px) {
  .shell { display: block; }
  .nav {
    position: fixed; top: auto; left: 50%; right: auto; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(420px, calc(100% - 32px)); height: auto;
    display: grid; grid-template-columns: repeat(5, 1fr);
    border-radius: 28px; padding: 8px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(22px) saturate(1.4);
  }
  .navbrand, .navfoot { display: none; }
  .brand { display: flex; }
  .nav button { flex-direction: row; justify-content: center; min-height: 46px; font-size: 0; padding: 0; border-radius: 18px; }
  .nav button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .top { justify-content: flex-end; background: transparent; }
  .maincol { padding: 20px 40px calc(120px + env(safe-area-inset-bottom)); max-width: 1180px; }
  .toast { left: 16px; right: 16px; bottom: 100px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
  #view { animation: none; }
}
#view { animation: rise .4s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
button.stage, .stage {
  position: relative; display: block; width: 100%; text-align: left;
  margin: 2px 0 16px; padding: 22px 16px 16px; border: 0; border-radius: 28px;
  overflow: hidden; color: #f6f1e8; background: #14110e;
  box-shadow: 0 24px 50px color-mix(in srgb, #000 28%, transparent);
}
.stage-bg { position: absolute; inset: -20px; background-size: cover; background-position: center 30%; filter: blur(22px) saturate(1.15); transform: scale(1.08); opacity: .5; }
.stage-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,10,8,.15), #14110e 80%); }
.stage-body { position: relative; }
.stage .eyebrow { color: #e4a15a; }
.stage h2 { color: #f6f1e8; font-size: 40px; max-width: 12ch; margin: 0 0 8px; }
.stage .lead, .stage .meta { color: #e4d5c6; }
.stage .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.feature { display: grid; grid-template-columns: 1fr 112px; gap: 14px; align-items: end; min-height: 230px; }
.feature .tile-poster { box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.stage .btn.ghost { color: #f6f1e8; border-color: rgba(246,241,232,.35); background: transparent; }
.program { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.shot { min-width: 0; color: inherit; }
.shot img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 12px; display: block; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
.shot span { display: block; margin-top: 6px; font-size: 12px; line-height: 1.25; color: #e7d7c4; }
.toolbar > .field { min-height: 52px; border-radius: 999px; padding-left: 18px; font-size: 16px; }
.ticket {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  margin: 0 0 14px; padding: 12px 14px; border-radius: 18px;
  background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  border: 1px dashed color-mix(in srgb, var(--accent) 50%, var(--line));
}
.ticket p { margin: 0; font-size: 14px; max-width: 36rem; }
.flag.proof { letter-spacing: 0.08em; }
.tile { transition: transform .18s ease; }
.tile:hover { transform: translateY(-4px); }
.tile:active { transform: translateY(0); }
@media (min-width: 720px) {
  .program { grid-template-columns: repeat(6, 1fr); }
  .feature { grid-template-columns: 1fr 200px; min-height: 300px; }
  .stage h2 { font-size: 56px; }
}
@media (min-width: 960px) {
  button.stage, .stage { margin-left: 0; margin-right: 0; padding: 28px 28px 22px; }
  .feature { grid-template-columns: 1fr 240px; min-height: 340px; }
}
.top, .card, .pagehead, .ticket, details.filters, .field, .select, textarea {
  background: rgba(255, 255, 255, 0.07);
  border-color: rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(16px);
}
.pagehead {
  background:
    radial-gradient(280px 140px at 100% 0%, rgba(236, 72, 153, 0.45), transparent 60%),

async function loadRelated(item) {
  state.related = { id: item.id, loading: true, items: [], error: "" };
  paint({ keepScroll: true });
  const out = [];
  const seen = new Set([item.id]);
  const push = (kind, id, title, posterPath, year, reason) => {
    const key = kind + "-" + id;
    if (!id || seen.has(key)) return;
    seen.add(key);
    out.push({ kind, tmdbId: id, title: title || "", posterPath: posterPath || "", year: year || "", reason });
  };
  try {
    if (item.collectionId) {
      const col = await tmdb("/collection/" + item.collectionId);
      for (const part of col.parts || []) {
        push("movie", part.id, part.title || part.name, part.poster_path, (part.release_date || "").slice(0, 4), t("reasonCollection", { name: item.collectionName || col.name || "" }));
      }
    }
    const director = (item.directors || [])[0];
    if (director && director.id) {
      const credits = await tmdb("/person/" + director.id + "/combined_credits");
      const works = (credits.crew || []).filter((c) => c.job === "Director" || c.job === "Creator" || c.department === "Directing");
      works.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
      let n = 0;
      for (const work of works) {
        if (n >= 8) break;
        if (work.media_type !== "movie" && work.media_type !== "tv") continue;
        const before = out.length;
        push(work.media_type, work.id, work.title || work.name, work.poster_path, (work.release_date || work.first_air_date || "").slice(0, 4), t("reasonDirector", { name: director.name }));
        if (out.length > before) n++;
      }
    }
    for (const actor of (item.cast || []).slice(0, 3)) {
      if (!actor.id) continue;
      const credits = await tmdb("/person/" + actor.id + "/combined_credits");
      const works = (credits.cast || []).slice().sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
      let n = 0;
      for (const work of works) {
        if (n >= 4) break;
        if (work.media_type !== "movie" && work.media_type !== "tv") continue;
        const before = out.length;
        push(work.media_type, work.id, work.title || work.name, work.poster_path, (work.release_date || work.first_air_date || "").slice(0, 4), t("reasonActor", { name: actor.name }));
        if (out.length > before) n++;
      }
    }
    state.related = { id: item.id, loading: false, items: out.slice(0, 18), error: "" };
  } catch (e) {
    state.related = { id: item.id, loading: false, items: out.slice(0, 18), error: tmdbMessage(e) || t("genericErr") };
  }
  paint({ keepScroll: true });
}

async function importJson(file) {
  const text = await file.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { toast(t("importBad")); return; }
  const rawItems = Array.isArray(data) ? data : data && Array.isArray(data.items) ? data.items : null;
  if (!rawItems) { toast(t("importBad")); return; }
  const existing = new Set(state.items.map((i) => i.id));
  const incoming = [];
  for (const raw of rawItems) {
    if (!raw || typeof raw !== "object") continue;
    let kind = raw.kind || raw.mediaType || raw.type;
    if (kind === "film") kind = "movie";
    if (kind === "series" || kind === "show") kind = "tv";
    const tmdbId = Number(raw.tmdbId || raw.tmdb_id || 0);
    let id = raw.id ? String(raw.id) : "";
    if (!id && tmdbId && (kind === "movie" || kind === "tv")) id = kind + "-" + tmdbId;
    if (!id) continue;
    const item = normalizeItem({ ...raw, id, kind: id.startsWith("list:") ? "list" : kind, tmdbId });
    if (!item) continue;
    if (!existing.has(item.id) && !item.updated) item.updated = Date.now();
    incoming.push(item);
  }
  if (!incoming.length) { toast(t("importBad")); return; }
  const merged = mergeRecords(incoming, state.items);
  state.items = await idbReplace(merged);
  scheduleSync();
  toast(t("imported", { n: incoming.length }));
  paint();
}
function runSelfTest() {
  const older = normalizeItem({ id: "movie-1", kind: "movie", title: "A", updated: 10, status: "visto", tmdbId: 1 });
  const newer = normalizeItem({ id: "movie-1", kind: "movie", title: "B", updated: 20, status: "da_vedere", tmdbId: 1 });
  const tomb = normalizeItem({ id: "movie-1", kind: "movie", title: "B", updated: 30, del: true, tmdbId: 1 });
  const m1 = mergeRecords([newer], [older]);
  if (m1.length !== 1 || m1[0].title !== "B" || m1[0].updated !== 20) throw new Error("merge local");
  const m2 = mergeRecords([older], [newer]);
  if (m2[0].title !== "B") throw new Error("merge remote");
  const m3 = mergeRecords([older], [tomb]);
  if (!m3[0].del) throw new Error("tombstone");
  if (normalizeRating(7.24) !== 7 || normalizeRating(7.25) !== 7.5 || normalizeRating(11) !== 10 || normalizeRating(-1) !== 0) throw new Error("rating");
  const sample = [normalizeItem({ id: "movie-2", kind: "movie", title: "X", tmdbId: 2, status: "visto", rating: 8, genres: ["Dramma"], countries: ["Italia"], year: "1994", notes: "ciao", lists: ["K-drama"], directors: [{ name: "Mario Rossi" }], cast: [{ name: "Anna Bianchi" }], tags: ["noir"] })];
  if (!haystack(sample[0]).includes("mario rossi") || !haystack(sample[0]).includes("noir")) throw new Error("search");
  if (goalTier(0, [1, 10, 40]) !== 0 || goalTier(1, [1, 10, 40]) !== 1 || goalTier(10, [1, 10, 40]) !== 2 || goalTier(40, [1, 10, 40]) !== 3) throw new Error("tier");
  const show = normalizeItem({ id: "tv-3", kind: "tv", title: "S", tmdbId: 3, status: "da_vedere", seasons: [{ n: 1, episodeCount: 2 }], seen: {} });
  show.seen["1"] = [1];
  if (autoStatus(show) !== "in_corso") throw new Error("status partial");
  show.seen["1"] = [1, 2];
  if (autoStatus(show) !== "completato") throw new Error("status done");
  show.status = "abbandonato";
  if (autoStatus(show) !== "abbandonato") throw new Error("status hold");
  console.info("cineteca selftest ok");
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.dataset.act === "ep" || el.tagName === "FORM") return;
  onAct(el.dataset.act, el, ev).catch((e) => {
    const msg = tmdbMessage(e);
    if (msg) toast(msg);
  });
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.act === "ep") {
    onEpisode(el).catch((e) => toast(tmdbMessage(e) || t("genericErr")));
    return;
  }
  if (el.id === "fStatus" || el.id === "fGenre" || el.id === "fTag" || el.id === "fSort") {
    state.f.status = document.getElementById("fStatus").value;
    state.f.genre = document.getElementById("fGenre").value;
    state.f.tag = document.getElementById("fTag").value;
    state.f.sort = document.getElementById("fSort").value;
    const box = document.getElementById("list");
    if (box) box.innerHTML = libraryItemsHtml();
    return;
  }
  if (el.id === "ratingRange" && state.detail) {
    state.detail.rating = normalizeRating(el.value);
    const num = document.getElementById("scoreNum");
    if (num) num.textContent = formatScore(state.detail.rating);
    paintStars(state.detail.rating);
    saveItem(state.detail, { activity: true }).then(() => { state.detailInLibrary = true; });
    return;
  }
  if (el.id === "importFile" && el.files && el.files[0]) {
    importJson(el.files[0]).catch(() => toast(t("importBad")));
    el.value = "";
    return;
  }
  if (el.id === "theme") {
    settings.theme = el.value;
    saveSettings();
    applyTheme();
  }
});
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "q") {
    state.f.q = el.value;
    const box = document.getElementById("list");
    if (box) box.innerHTML = libraryItemsHtml();
  } else if (el.id === "ratingRange") {
    const num = document.getElementById("scoreNum");
    if (num) num.textContent = formatScore(el.value);
    paintStars(el.value);
  } else if (el.id === "searchQ") {
    state.searchQ = el.value;
    clearTimeout(searchTimer);
    const q = el.value.trim();
    if (q.length < 2) {
      if (!q) {
        state.searchResults = [];
        state.searchMsg = "";
        const box = document.getElementById("searchOut");
        if (box) box.innerHTML = searchResultsHtml();
      }
      return;
    }
    searchTimer = setTimeout(() => { doSearch(q); }, 420);
  } else if (el.id === "notes" && state.detail) {
    state.detail.notes = el.value;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => saveItem(state.detail, { activity: false }), 800);
  } else if (el.id === "newList") state.listDraft = el.value;
});
let noteTimer = null;
let searchTimer = null;
document.addEventListener("submit", (ev) => {
  const form = ev.target;
  if (!form || !form.dataset) return;
  ev.preventDefault();
  if (!form.dataset.act) return;
  onAct(form.dataset.act, form, ev).catch((e) => {
    const msg = tmdbMessage(e);
    if (msg) toast(msg);
  });
});
document.addEventListener("error", (ev) => {
  const img = ev.target;
  if (!img || img.tagName !== "IMG" || !img.classList.contains("ph")) return;
  const wrap = img.parentElement;
  const letter = img.dataset.initial || img.alt || "·";
  img.remove();
  if (!wrap || wrap.querySelector("img, .letter")) return;
  const span = document.createElement("span");
  span.className = "letter";
  span.textContent = letter;
  wrap.prepend(span);
}, true);
function paintStars(rating) {
  const n = rating === null || rating === undefined || rating === "" ? null : Number(rating);
  document.querySelectorAll(".star").forEach((btn) => {
    const i = Number(btn.dataset.value);
    const fill = n === null || Number.isNaN(n) ? 0 : n >= i ? 100 : n >= i - 0.5 ? 50 : 0;
    const fg = btn.querySelector(".star-fg");
    if (fg) fg.style.width = fill + "%";
  });
}

async function onEpisode(el) {
  const item = state.detail;
  if (!item) return;
  const season = String(el.dataset.season);
  const ep = Number(el.dataset.ep);
  const set = new Set((item.seen[season] || []).map(Number));
  if (el.checked) set.add(ep); else set.delete(ep);
  item.seen[season] = [...set].sort((a, b) => a - b);
  item.status = autoStatus(item);
  state.detailInLibrary = true;
  if (!state.items.some((i) => i.id === item.id)) state.items.push(item);
  await saveItem(item, { activity: true });
  paint({ keepScroll: true });
}
async function onAct(act, el, ev) {
  if (act === "nav") { go(el.dataset.hash); return; }
  if (act === "reveal-key") {
    const input = document.getElementById("tmdbKey");
    if (!input) return;
    input.type = input.type === "password" ? "text" : "password";
    el.textContent = input.type === "password" ? t("showKey") : t("hideKey");
    return;
  }
  if (act === "back") {
    if (history.length > 1) history.back();
    else go("#/");
    return;
  }
  if (act === "open") { go("#/titolo/" + encodeURIComponent(el.dataset.id)); return; }
  if (act === "open-list") { go("#/lista/" + encodeURIComponent(el.dataset.name)); return; }
  if (act === "kind") {
    state.f.kind = el.dataset.kind;
    paint({ keepScroll: true });
    return;
  }
  if (act === "set-filter") {
    state.f.status = el.dataset.status || "tutti";
    paint({ keepScroll: true });
    return;
  }
  if (act === "viewmode") {
    state.f.view = el.dataset.view === "list" ? "list" : "wall";
    paint({ keepScroll: true });
    return;
  }
  if (act === "hours") {
    state.f.hours = el.dataset.scope || "tutti";
    paint({ keepScroll: true });
    return;
  }
  if (act === "set-rate" && state.detail) {
    const n = Number(el.dataset.value);
    if (!Number.isFinite(n)) return;
    state.detail.rating = state.detail.rating === n ? normalizeRating(n - 0.5) : n;
    state.detailInLibrary = true;
    if (!state.items.some((i) => i.id === state.detail.id)) state.items.push(state.detail);
    await saveItem(state.detail, { activity: true });
    paint({ keepScroll: true });
    return;
  }
  if (act === "ep-btn") {
    const season = String(el.dataset.season);
    const ep = Number(el.dataset.ep);
    const set = new Set(((state.detail && state.detail.seen[season]) || []).map(Number));
    await onEpisode({ dataset: { season, ep: String(ep) }, checked: !set.has(ep) });
    return;
  }
  if (act === "seed-demo") { await seedDemo(false); return; }
  if (act === "clear-demo") { await clearDemo(); return; }
  if (act === "create-list") {
    ev.preventDefault();
    const name = (document.getElementById("newList") || {}).value || state.listDraft;
    const before = state.items.some((i) => i.kind === "list" && !i.del && i.name.toLocaleLowerCase("it") === name.trim().toLocaleLowerCase("it"));
    if (before) { toast(t("listExists")); return; }
    const created = await ensureList(name);
    if (!created) return;
    state.listDraft = "";
    toast(t("listCreated"));
    paint({ keepScroll: true });
    return;
  }
  if (act === "do-search") {
    ev.preventDefault();
    const q = (document.getElementById("searchQ").value || "").trim();
    state.searchQ = q;
    if (!q) { state.searchResults = []; state.searchMsg = ""; paint({ keepScroll: true }); return; }
    await doSearch(q);
    return;
  }
  if (act === "add" || act === "status") {
    const item = state.detail;
    if (!item) return;
    const status = el.dataset.status || item.status || "da_vedere";
    const existing = state.items.find((i) => i.id === item.id);
    if (existing) {
      copyCache(existing, item);
      existing.notes = item.notes;
      existing.rating = item.rating;
      existing.tags = item.tags;
      existing.lists = item.lists;
      existing.seen = item.seen;
      existing.del = false;
      existing.status = status;
      state.detail = existing;
    } else {
      item.status = status;
      item.addedAt = item.addedAt || Date.now();
      state.items.push(item);
    }
    state.detailInLibrary = true;
    state.detailWasDeleted = false;
    await saveItem(state.detail, { activity: true });
    toast(act === "add" ? t("added") : t("saved"));
    paint({ keepScroll: true });
    return;
  }
  if (act === "clear-rating" && state.detail) {
    state.detail.rating = null;
    state.detailInLibrary = true;
    if (!state.items.some((i) => i.id === state.detail.id)) state.items.push(state.detail);
    await saveItem(state.detail, { activity: true });
    paint({ keepScroll: true });
    return;
  }
  if (act === "add-tag") {
    ev.preventDefault();
    const input = document.getElementById("tagInput");
    const tag = (input.value || "").trim();
    if (!tag || !state.detail) return;
    state.detail.tags = state.detail.tags || [];
    if (!state.detail.tags.some((x) => x.toLocaleLowerCase("it") === tag.toLocaleLowerCase("it"))) state.detail.tags.push(tag);
    state.detailInLibrary = true;
    if (!state.items.some((i) => i.id === state.detail.id)) state.items.push(state.detail);
    await saveItem(state.detail, { activity: false });
    paint({ keepScroll: true });
    return;
  }
  if (act === "del-tag" && state.detail) {
    state.detail.tags = (state.detail.tags || []).filter((tag) => tag !== el.dataset.tag);
    await saveItem(state.detail, { activity: false });
    paint({ keepScroll: true });
    return;
  }
  if (act === "toggle-list" && state.detail) {
    const name = el.dataset.name;
    const lists = new Set(state.detail.lists || []);
    if (lists.has(name)) lists.delete(name); else lists.add(name);
    state.detail.lists = [...lists];
    state.detailInLibrary = true;
    if (!state.items.some((i) => i.id === state.detail.id)) state.items.push(state.detail);
    await saveItem(state.detail, { activity: false });
    paint({ keepScroll: true });
    return;
  }
  if (act === "add-list-item") {
    ev.preventDefault();
    const name = (document.getElementById("listOnItem").value || "").trim();
    if (!name || !state.detail) return;
    await ensureList(name);
    if (!(state.detail.lists || []).some((n) => n.toLocaleLowerCase("it") === name.toLocaleLowerCase("it"))) {
      state.detail.lists = [...(state.detail.lists || []), name];
    }
    state.detailInLibrary = true;
    if (!state.items.some((i) => i.id === state.detail.id)) state.items.push(state.detail);
    await saveItem(state.detail, { activity: false });
    toast(t("listCreated"));
    paint({ keepScroll: true });
    return;
  }
  if (act === "toggle-season" && state.detail) {
    const n = Number(el.dataset.season);
    const key = state.detail.id + ":" + n;
    if (state.openSeasons.has(key)) {
      state.openSeasons.delete(key);
      paint({ keepScroll: true });
      return;
    }
    state.openSeasons.add(key);
    if (!state.seasonCache[key]) {
      state.seasonLoading.add(key);
      paint({ keepScroll: true });
      try { await loadSeason(state.detail, n); delete state.seasonError[key]; }
      catch (e) { state.seasonError[key] = tmdbMessage(e) || t("genericErr"); }
      finally { state.seasonLoading.delete(key); }
    }
    paint({ keepScroll: true });
    return;
  }
  if (act === "mark-season" && state.detail) {
    const n = Number(el.dataset.season);
    const season = (state.detail.seasons || []).find((s) => s.n === n);
    let eps = state.seasonCache[state.detail.id + ":" + n];
    if (!eps) {
      try { eps = await loadSeason(state.detail, n); }
      catch (e) { eps = null; }
    }
    const nums = eps && eps.length ? eps.map((ep) => ep.n) : Array.from({ length: (season && season.episodeCount) || 0 }, (_, i) => i + 1);
    state.detail.seen[String(n)] = el.dataset.on === "1" ? nums : [];
    state.detail.status = autoStatus(state.detail);
    state.detailInLibrary = true;
    if (!state.items.some((i) => i.id === state.detail.id)) state.items.push(state.detail);
    await saveItem(state.detail, { activity: true });
    paint({ keepScroll: true });
    return;
  }
  if (act === "load-related" && state.detail) { await loadRelated(state.detail); return; }
  if (act === "refresh-title" && state.detail) {
    const fresh = await fetchTitle(state.detail.kind, state.detail.tmdbId);
    copyCache(state.detail, fresh);
    state.detail.nextEpisode = fresh.nextEpisode;
    if (state.detailInLibrary || state.items.some((i) => i.id === state.detail.id && !i.del)) {
      await saveItem(state.detail, { activity: false });
    }
    toast(t("refreshed"));
    paint({ keepScroll: true });
    return;
  }
  if (act === "delete-title" && state.detail) {
    if (!confirm(t("removeAsk"))) return;
    state.detail.del = true;
    await saveItem(state.detail, { activity: false });
    toast(t("removed"));
    go("#/");
    return;
  }
  if (act === "save-settings") {
    pullSettingsFromForm();
    toast(t("saved"));
    paint({ keepScroll: true });
    return;
  }
  if (act === "test-sheet") {
    pullSettingsFromForm();
    try {
      const items = await sheetGet();
      toast(t("testOk", { n: items.length }));
      state.syncError = "";
    } catch (e) {
      state.syncError = e.message || t("testFail");
      toast(state.syncError);
    }
    paintSync();
    return;
  }
  if (act === "sync-now") {
    pullSettingsFromForm();
    await runSync();
    return;
  }
  if (act === "refresh-upcoming") { await refreshUpcoming(); return; }
  if (act === "refresh-providers") { await refreshProviders(); return; }
  if (act === "export") { exportJson(); return; }
  if (act === "restore") {
    const item = state.items.find((i) => i.id === el.dataset.id);
    if (!item) return;
    item.del = false;
    await saveItem(item, { activity: false });
    toast(t("restored"));
    paint({ keepScroll: true });
    return;
  }
  if (act === "delete-list") {
    const name = el.dataset.name || "";
    if (!name || !confirm(t("deleteListAsk", { name }))) return;
    const rec = state.items.find((i) => i.kind === "list" && !i.del && i.name === name);
    if (rec) {
      rec.del = true;
      await saveItem(rec, { activity: false });
    }
    for (const item of titlesOf(state.items)) {
      if ((item.lists || []).includes(name)) {
        item.lists = item.lists.filter((n) => n !== name);
        await saveItem(item, { activity: false });
      }
    }
    toast(t("removed"));
    go("#/");
  }
}

async function boot() {
  loadSettings();
  await loadPrivateKey();
  applyTheme();
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (settings.theme === "auto") applyTheme();
    });
  }
  await askPersist();
  try { state.items = await idbAll(); }
  catch (e) { state.items = []; toast(t("genericErr")); }
  if (!titlesOf(state.items).length) {
    let off = false;
    try { off = localStorage.getItem("cineteca-demo-off") === "1"; } catch (err) {}
    if (!off) {
      try { await seedDemo(true); }
      catch (err) { console.error(err); }
    }
  }
  window.addEventListener("hashchange", () => { onRoute(); });
  window.addEventListener("online", () => { runSync(); });
  const host = location.hostname;
  if (host === "127.0.0.1" || host === "localhost") {
    state.swText = t("swPreview");
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.unregister();
    }
  } else if (navigator.serviceWorker) {
    navigator.serviceWorker.register("./sw.js").then(() => { state.swText = t("swOn"); paintChrome(); }).catch(() => { state.swText = t("swOff"); });
  }
  if (new URLSearchParams(location.search).has("selftest")) {
    try { runSelfTest(); }
    catch (e) { console.error(e); toast(String(e.message || e)); }
  }
  await onRoute();
  window.__ready = true;
  if (sheetUrl() && settings.token) runSync();
}
boot().catch((e) => {
  console.error(e);
  toast(t("genericErr"));
});
</script>
